<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <rect width="640" height="360" fill="#0c0e17" />
  <pattern id="scanlines2" width="100" height="4" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  </pattern>
  <rect width="640" height="360" fill="url(#scanlines2)" />
  
  <!-- Room Interior Lecture Hall Mockup -->
  <rect x="140" y="160" width="360" height="150" fill="#141c2c" rx="4" />
  <line x1="40" y1="310" x2="600" y2="310" stroke="#25334d" stroke-width="2" />

  <!-- Vision Negative Inspection Bounding Box (ORANGE/DASHED) -->
  <rect x="210" y="110" width="220" height="160" fill="rgba(249, 115, 22, 0.08)" stroke="#f97316" stroke-width="2" rx="4" stroke-dasharray="6 6" />

  <!-- AI Tag Header -->
  <rect x="210" y="84" width="220" height="24" fill="#f97316" rx="3" />
  <text x="218" y="100" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIREARM NOT VERIFIED (0.08)</text>

  <!-- Clear Negative Icon in box -->
  <circle cx="320" cy="180" r="28" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="2" />
  <line x1="304" y1="180" x2="336" y2="180" stroke="#f97316" stroke-width="3" stroke-linecap="round" />

  <!-- Status Bar Overlay (Top) -->
  <rect x="16" y="16" width="608" height="34" fill="rgba(10, 14, 23, 0.85)" rx="6" stroke="#223049" />
  <circle cx="32" cy="33" r="5" fill="#f97316" />
  <text x="44" y="37" fill="#f97316" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">ALERT | SC-204 LECTURE 204 | WEBCAM GATEWAY #2</text>
  <text x="490" y="37" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">AUDIO: 88% (TINYML)</text>

  <!-- Plain Clear Callout Notice (Bottom) -->
  <rect x="16" y="308" width="608" height="36" fill="rgba(249, 115, 22, 0.9)" rx="6" />
  <text x="320" y="331" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">UNVERIFIED AUDIO TRIGGER: NO FIREARM DETECTED IN CAMERA FEED</text>
</svg>
