<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <rect width="640" height="360" fill="#080c14" />
  <!-- CCTV scan lines -->
  <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  </pattern>
  <rect width="640" height="360" fill="url(#scanlines)" />
  
  <!-- Camera Grid Guidelines -->
  <line x1="213" y1="0" x2="213" y2="360" stroke="#162032" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="426" y1="0" x2="426" y2="360" stroke="#162032" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="0" y1="180" x2="640" y2="180" stroke="#162032" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Room Interior Silhouette Mockup -->
  <rect x="180" y="140" width="120" height="180" fill="#111927" rx="4" />
  <rect x="340" y="160" width="180" height="160" fill="#0f172a" rx="4" />
  <line x1="60" y1="320" x2="580" y2="320" stroke="#223049" stroke-width="3" />

  <!-- AI Vision Detection Bounding Box (RED - Verified Threat) -->
  <rect x="230" y="90" width="170" height="200" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="3" rx="4" stroke-dasharray="8 4" />
  
  <!-- Bounding Box Corner Target Accents -->
  <path d="M 220 110 L 220 80 L 250 80" fill="none" stroke="#ef4444" stroke-width="4" />
  <path d="M 380 80 L 410 80 L 410 110" fill="none" stroke="#ef4444" stroke-width="4" />
  <path d="M 410 270 L 410 300 L 380 300" fill="none" stroke="#ef4444" stroke-width="4" />
  <path d="M 250 300 L 220 300 L 220 270" fill="none" stroke="#ef4444" stroke-width="4" />

  <!-- AI Tag Header -->
  <rect x="230" y="62" width="170" height="24" fill="#ef4444" rx="3" />
  <text x="240" y="78" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">FIREARM 94% [VERIFIED]</text>

  <!-- Crosshair Target -->
  <circle cx="315" cy="180" r="16" fill="none" stroke="#ef4444" stroke-width="2" />
  <line x1="315" y1="156" x2="315" y2="204" stroke="#ef4444" stroke-width="2" />
  <line x1="291" y1="180" x2="339" y2="180" stroke="#ef4444" stroke-width="2" />

  <!-- Status Bar Overlay (Top) -->
  <rect x="16" y="16" width="608" height="34" fill="rgba(10, 14, 23, 0.85)" rx="6" stroke="#223049" />
  <circle cx="32" cy="33" r="5" fill="#ef4444" />
  <text x="44" y="37" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">REC LIVE | SC-101 LAB 101 | WEBCAM GATEWAY #1</text>
  <text x="490" y="37" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">AUDIO: 98% (TINYML)</text>

  <!-- High Risk Banner (Bottom) -->
  <rect x="16" y="308" width="608" height="36" fill="rgba(239, 68, 68, 0.9)" rx="6" />
  <text x="320" y="331" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">CRITICAL THREAT: ACOUSTIC &amp; FIREARM VISION VERIFIED</text>
</svg>
